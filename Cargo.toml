[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-platform",
    "crates/engine-assets",
    "crates/engine-audio",
    "crates/engine",
    "games/fear-cards",
    "crates/game-rules",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Logging
log = "0.4"
env_logger = "0.11"

# Math (serde feature lets Transform2D round-trip through RON)
glam = { version = "0.29", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
ron = "0.8"

# Errors
thiserror = "2"

# Platform
winit = "0.30"

# Renderer
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# Assets (only PNG + JPEG features to keep the dep tree lean)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Internal crates
engine-core     = { path = "crates/engine-core" }
engine-render   = { path = "crates/engine-render" }
engine-platform = { path = "crates/engine-platform" }
engine-assets   = { path = "crates/engine-assets" }
engine-audio    = { path = "crates/engine-audio" }
engine          = { path = "crates/engine" }

# Optimize deps fully in dev; keep our own code cheap to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3